<form (ngSubmit)=register() #form="ngForm">

    <input matInput #input name="nickname" maxlength="10" [(ngModel)]="nickname" placeholder="Enter nickname" />

    <input matInput #input name="password" type="password" [(ngModel)]="password" placeholder="Enter password"/>

  <input matInput #input name="password again" type="password" [(ngModel)]="passwordConfirm" placeholder="Confirm password"/>

    <button (click)="register()" name="nickname" matButton="tonal" type="submit" color="red"  >Submit</button>

</form>
