<div class="mainContainer">

  <div class="userInfo">
    {{ userDetails.username }}
  </div>

  <div class="mainGraph">
    <div>
    </div>
  </div>

  <div class="goalsOverview">
    <table>
      <thead>
      <tr>
        <th>Name</th>
        <th>Deadline</th>
        <th>Progress</th>
      </tr>
      </thead>
      <tbody>
        @for (goal of goalsDetails; track goal) {
          <tr>
            <td>{{ goal.name }}</td>
            <td>{{ goal.deadline }}</td>
            <td>{{ goal.progress }}%</td>
          </tr>
        }
      </tbody>
    </table>

    <br/><br/>

    <button (click)="createGoalRedirect()" mat-button color="primary">Create a new goal</button>
  </div>

</div>
<button (click)="logout()" matButton="tonal" type="submit" color="red">Logout</button>
