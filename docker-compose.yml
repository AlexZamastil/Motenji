version: '3.8'

services:

  db:
    image: postgres
    restart: always
    shm_size: 128mb

    environment:
      POSTGRES_DB: motenji
      POSTGRES_USER: ${db_username}
      POSTGRES_PASSWORD: ${db_password}
    ports:
      - "5432:5432"    
    networks:
      - skillmatrix-net

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    networks:
      - skillmatrix-net

networks:
  skillmatrix-net: