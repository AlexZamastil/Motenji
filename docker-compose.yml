version: '3.8'

services:

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb

    environment:
      POSTGRES_DB: motenji
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"    
    networks:
      - skillmatrix-net

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    networks:
      - skillmatrix-net

networks:
  skillmatrix-net: